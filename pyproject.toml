[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trello-notion-sync"
version = "0.1.0"
description = "One-way sync from Trello to Notion via GitHub Actions polling."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
