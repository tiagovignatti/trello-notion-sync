# Trello list name → Notion Status select value.
# Empty = passthrough (Notion Status uses the Trello list name verbatim).
# Cards in CLOSED Trello lists are never synced — enforced in code via the
# list's `closed` flag, not via this file.
status_by_list: {}

# Trello label name → Notion multi-select Tag value. Empty = passthrough.
tags_by_label: {}
