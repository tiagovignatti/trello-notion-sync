name: Trello → Notion sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Avoid overlapping runs (cron + manual dispatch can race).
concurrency:
  group: trello-sync
  cancel-in-progress: false

# Required so the auto-commit step can push state file changes.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Sync
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python -m src.sync trello

      # Only commits when state/*.json actually changed. Skipped on prior failure.
      - name: Commit state
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(state): sync run #${{ github.run_number }}"
          file_pattern: 'state/*.json'
